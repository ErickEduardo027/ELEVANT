server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /healthz {
        try_files /healthz =404;
        default_type text/plain;
        access_log off;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/elevant-security-headers.conf;
    }

    location = /.csp-script-hashes { return 404; }

    location ^~ /_next/static/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/elevant-security-headers.conf;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/elevant-security-headers.conf;
    }

    location = /dashboard.html { return 308 /admin-occ/dashboard; }
    location = /contracts.html { return 308 /contratos; }
    location = /finance.html { return 308 /finanzas; }

    location / {
        try_files $uri $uri.html $uri/index.html /404.html;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/elevant-security-headers.conf;
    }
}
