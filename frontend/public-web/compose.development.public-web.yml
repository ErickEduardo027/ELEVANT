name: elevant-dev-public-web

services:
  public-web:
    image: "${ELEVANT_PUBLIC_WEB_IMAGE:?Set an immutable GHCR Public Web image including an @sha256 digest}"
    pull_policy: always
    init: true
    user: "1000:1000"
    environment:
      NODE_ENV: "production"
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    ports:
      - "127.0.0.1:18082:3000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=1700
      - /app/frontend/public-web/.next/cache:rw,noexec,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 0.35
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.mjs"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - runtime

networks:
  runtime:
    external: true
    name: elevant-dev-public-web-runtime
