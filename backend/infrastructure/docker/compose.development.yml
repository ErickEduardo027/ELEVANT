name: elevant-development

services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Testing"
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__ElevantDatabase: "${ELEVANT_DATABASE_CONNECTION_STRING:?ELEVANT_DATABASE_CONNECTION_STRING must be set}"
      Cors__AllowedOrigins__0: "${CORS_ALLOWED_ORIGIN_0:?CORS_ALLOWED_ORIGIN_0 must be set}"
      Cors__AllowedOrigins__1: "${CORS_ALLOWED_ORIGIN_1:-}"
      Cors__AllowedOrigins__2: "${CORS_ALLOWED_ORIGIN_2:-}"
      Cors__AllowedOrigins__3: "${CORS_ALLOWED_ORIGIN_3:-}"
      ForwardedHeaders__Enabled: "true"
      ForwardedHeaders__ForwardLimit: "1"
      ForwardedHeaders__KnownNetworks__0: "${FORWARDED_HEADERS_KNOWN_NETWORK_0:?FORWARDED_HEADERS_KNOWN_NETWORK_0 must be set to the trusted proxy network CIDR}"
      HttpsRedirection__Enabled: "false"
      Swagger__Enabled: "true"
    expose:
      - "8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
      sqlserver:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - edge
      - data

  db-init:
    image: "${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}"
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set}"
    entrypoint:
      - /bin/bash
      - -c
    command:
      - >-
        if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then
          SQLCMD=/opt/mssql-tools18/bin/sqlcmd;
        elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then
          SQLCMD=/opt/mssql-tools/bin/sqlcmd;
        else
          echo "sqlcmd was not found in the SQL Server image" >&2;
          exit 1;
        fi;
        "$$SQLCMD" -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -C -b -i /bootstrap/initialize-development.sql
    volumes:
      - ../../database/scripts/bootstrap/initialize-development.sql:/bootstrap/initialize-development.sql:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"
    networks:
      - data

  sqlserver:
    image: "${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set}"
    expose:
      - "1433"
    volumes:
      - sql-development-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null;
          else
            /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null;
          fi
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped
    networks:
      - data

volumes:
  sql-development-data:
    name: elevant-sql-development-data

networks:
  edge:
    external: true
    name: "${DOKPLOY_NETWORK_NAME:?DOKPLOY_NETWORK_NAME must be set to the network used by the Dokploy proxy}"
  data:
    name: elevant-development-data
    internal: true
