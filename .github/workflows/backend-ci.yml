name: Backend CI

on:
  push:
    branches:
      - main
      - Development
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches:
      - main
      - Development
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Restore, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      NUGET_XMLDOC_MODE: skip
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
          cache: true
          cache-dependency-path: "backend/**/packages.lock.json"

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore locked dependencies
        run: dotnet restore Elevant.sln --locked-mode

      - name: Build
        run: dotnet build Elevant.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Elevant.sln --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Validate Development Compose
        env:
          MSSQL_SA_PASSWORD: REPLACE_ME_CI_StrongPassword123!
          ELEVANT_DATABASE_CONNECTION_STRING: Server=sqlserver,1433;Database=ElevantDevelopmentDb;User Id=sa;Password=REPLACE_ME_CI_StrongPassword123!;Encrypt=True;TrustServerCertificate=True
          CORS_ALLOWED_ORIGIN_0: http://localhost:3000
          DOKPLOY_NETWORK_NAME: ci-proxy
          FORWARDED_HEADERS_KNOWN_NETWORK_0: 172.30.0.0/16
        run: docker compose -f infrastructure/docker/compose.development.yml config --quiet

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results-${{ github.run_id }}
          path: backend/TestResults/**/*.trx
          if-no-files-found: error
          retention-days: 14
