name: API client CI

on:
  push:
    branches:
      - main
      - Development
    paths:
      - "packages/api-client/**"
      - "backend/Elevant.Api/**"
      - "backend/Elevant.Contracts/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "NuGet.config"
      - "global.json"
      - "frontend/private-web/.env.example"
      - "frontend/private-web/package.json"
      - "frontend/private-web/package-lock.json"
      - "frontend/private-web/vite.config.js"
      - "frontend/private-web/src/config/elevantApiClient.js"
      - "frontend/private-web/tests/elevantApiClient.smoke.test.js"
      - "frontend/public-web/.env.example"
      - "frontend/public-web/package.json"
      - "frontend/public-web/package-lock.json"
      - "frontend/public-web/next.config.ts"
      - "frontend/public-web/next-env.d.ts"
      - "frontend/public-web/tsconfig.json"
      - "frontend/public-web/vitest.config.ts"
      - "frontend/public-web/src/lib/elevant-api.ts"
      - "frontend/public-web/tests/unit/elevant-api-client.test.ts"
      - "frontend/mobile-agent/.env.example"
      - "frontend/mobile-agent/app.json"
      - "frontend/mobile-agent/eslint.config.js"
      - "frontend/mobile-agent/expo-env.d.ts"
      - "frontend/mobile-agent/metro.config.js"
      - "frontend/mobile-agent/package.json"
      - "frontend/mobile-agent/package-lock.json"
      - "frontend/mobile-agent/tsconfig.json"
      - "frontend/mobile-agent/src/config/elevant-api.ts"
      - "frontend/mobile-agent/tests/api-client.metro-smoke.ts"
      - ".github/workflows/api-client-ci.yml"
  pull_request:
    branches:
      - main
      - Development
    paths:
      - "packages/api-client/**"
      - "backend/Elevant.Api/**"
      - "backend/Elevant.Contracts/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "NuGet.config"
      - "global.json"
      - "frontend/private-web/.env.example"
      - "frontend/private-web/package.json"
      - "frontend/private-web/package-lock.json"
      - "frontend/private-web/vite.config.js"
      - "frontend/private-web/src/config/elevantApiClient.js"
      - "frontend/private-web/tests/elevantApiClient.smoke.test.js"
      - "frontend/public-web/.env.example"
      - "frontend/public-web/package.json"
      - "frontend/public-web/package-lock.json"
      - "frontend/public-web/next.config.ts"
      - "frontend/public-web/next-env.d.ts"
      - "frontend/public-web/tsconfig.json"
      - "frontend/public-web/vitest.config.ts"
      - "frontend/public-web/src/lib/elevant-api.ts"
      - "frontend/public-web/tests/unit/elevant-api-client.test.ts"
      - "frontend/mobile-agent/.env.example"
      - "frontend/mobile-agent/app.json"
      - "frontend/mobile-agent/eslint.config.js"
      - "frontend/mobile-agent/expo-env.d.ts"
      - "frontend/mobile-agent/metro.config.js"
      - "frontend/mobile-agent/package.json"
      - "frontend/mobile-agent/package-lock.json"
      - "frontend/mobile-agent/tsconfig.json"
      - "frontend/mobile-agent/src/config/elevant-api.ts"
      - "frontend/mobile-agent/tests/api-client.metro-smoke.ts"
      - ".github/workflows/api-client-ci.yml"

permissions:
  contents: read

concurrency:
  group: api-client-ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate source contract and generated client
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      NUGET_XMLDOC_MODE: skip

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/api-client/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Install API client dependencies
        working-directory: packages/api-client
        run: npm ci

      - name: Build OpenAPI source host
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet restore backend/Elevant.Api/Elevant.Api.csproj --locked-mode
          dotnet build backend/Elevant.Api/Elevant.Api.csproj \
            --configuration Release \
            --no-restore

      - name: Detect OpenAPI source and snapshot drift
        shell: bash
        run: |
          set -Eeuo pipefail

          actual="$RUNNER_TEMP/elevant-v1.actual.json"
          api_log="$RUNNER_TEMP/elevant-api.log"
          api_url=http://127.0.0.1:5080/swagger/v1/swagger.json

          ASPNETCORE_ENVIRONMENT=Testing \
          ASPNETCORE_URLS=http://127.0.0.1:5080 \
          Swagger__Enabled=true \
          ELEVANT_DATABASE_ENVIRONMENT=Development \
          ConnectionStrings__ElevantDatabase='Server=127.0.0.1,1;Initial Catalog=ElevantDevelopmentDb;Integrated Security=True;Encrypt=True;TrustServerCertificate=True;Connect Timeout=1' \
            dotnet backend/Elevant.Api/bin/Release/net10.0/Elevant.Api.dll \
              >"$api_log" 2>&1 &
          api_pid=$!

          cleanup() {
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          fetched=false
          for _ in {1..30}; do
            if curl --fail --silent --show-error \
              --max-time 5 \
              --output "$actual" \
              "$api_url"; then
              fetched=true
              break
            fi

            if ! kill -0 "$api_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [[ "$fetched" != true ]]; then
            cat "$api_log" >&2
            echo "The locally built API did not publish its OpenAPI document." >&2
            exit 1
          fi

          npm --prefix packages/api-client run check:openapi -- "$actual"

      - name: Run deterministic API client checks
        working-directory: packages/api-client
        run: npm run check

  private_web:
    name: Validate Private Web integration
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend/private-web

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/private-web/package-lock.json

      - name: Install Private Web dependencies
        run: npm ci

      - name: Test shared-client seam
        run: npm test -- tests/elevantApiClient.smoke.test.js

      - name: Build Private Web
        env:
          VITE_ELEVANT_API_URL: https://api.example.test
        run: npm run build

  public_web:
    name: Validate Public Web integration
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    defaults:
      run:
        working-directory: frontend/public-web

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_ELEVANT_API_URL: https://api.example.test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/public-web/package-lock.json

      - name: Install Public Web dependencies
        run: npm ci

      - name: Type-check Public Web
        run: npm run typecheck

      - name: Test Public Web
        run: npm test

      - name: Build Public Web
        run: npm run build

  mobile_agent:
    name: Validate Mobile Agent integration
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    defaults:
      run:
        working-directory: frontend/mobile-agent

    env:
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_ELEVANT_API_URL: https://api.example.test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/mobile-agent/package-lock.json

      - name: Install Mobile Agent dependencies
        run: npm ci

      - name: Lint Mobile Agent
        run: npm run lint

      - name: Type-check Mobile Agent
        run: npm run typecheck

      - name: Bundle shared client with Metro
        run: npm run test:api-client-bundle
