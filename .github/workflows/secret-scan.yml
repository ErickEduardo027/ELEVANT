name: Repository secret scan

on:
  workflow_call:
  push:
    branches:
      - main
      - Development
permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: Scan committed files for secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Scan repository for committed secrets
        shell: pwsh
        run: ./scripts/repository/check-secrets.ps1
      - name: Validate Actions path and dependency contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/release/tests/test-path-ownership.sh
          bash scripts/release/tests/test-classify-changes.sh
          node --test scripts/release/tests/test-development-dag.mjs \
            scripts/release/tests/test-pr-dag.mjs \
            scripts/release/tests/test-workflow-coverage.mjs
