[Unit]
# Order the normal boot transaction after the independently enabled firewall.
# This does not pull either service into a manual transaction.
After=elevant-firewall.service

[Service]
# Every Docker start/restart independently proves that the exact configured
# ELEVANT policy is active. The verifier is read-only and fail-closed.
ExecStartPre=/usr/local/sbin/elevant-firewall-apply --config /etc/elevant/firewall.env --verify-active
