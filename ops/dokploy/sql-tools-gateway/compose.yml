name: elevant-dev-sql-tools-gateway

services:
  sql-tools-gateway:
    image: docker.io/library/haproxy:3.2.23-alpine3.24@sha256:6343ce34a132a5dceaa24767d739df2bd519f8f7c1079ae39e4821334e8eb42e
    platform: linux/amd64
    pull_policy: always
    user: "65534:65534"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:11433:11433/tcp"
    configs:
      - source: haproxy_config
        target: /usr/local/etc/haproxy/haproxy.cfg
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,uid=65534,gid=65534,mode=0700
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          kill -0 1 &&
          nc -z -w 3 127.0.0.1 11433 &&
          nc -z -w 3 elevant-dev-sql 1433
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    stop_grace_period: 15s
    pids_limit: 64
    mem_limit: 64m
    cpus: "0.10"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      runtime:
        gw_priority: 1
      data:

configs:
  haproxy_config:
    file: ../files/haproxy.cfg

networks:
  runtime:
    external: true
    name: elevant-dev-sql-tools-runtime
  data:
    external: true
    name: elevant-dev-data
