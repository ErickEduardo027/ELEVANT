global
  log stdout format raw local0
  maxconn 32

defaults
  log global
  mode tcp
  option tcplog
  timeout connect 5s
  timeout client 1h
  timeout server 1h
  timeout check 3s

resolvers docker
  nameserver docker-dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 10s

frontend sql_tools
  bind :11433
  default_backend sql_server

backend sql_server
  option tcp-check
  server sql elevant-dev-sql:1433 check resolvers docker init-addr libc,none inter 5s fall 3 rise 2
